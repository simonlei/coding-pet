name: Build Binaries

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      - name: Prepare variables
        id: vars
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          PKG="coding-pet-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ext=${EXT}"         >> "$GITHUB_OUTPUT"
          echo "pkg=${PKG}"         >> "$GITHUB_OUTPUT"

      - name: Build agent & server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          OUT="dist/${{ steps.vars.outputs.pkg }}"
          mkdir -p "$OUT"
          LDFLAGS="-s -w -X main.version=${{ steps.vars.outputs.version }}"
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "$OUT/coding-pet-agent${{ steps.vars.outputs.ext }}" ./cmd/agent
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "$OUT/coding-pet-server${{ steps.vars.outputs.ext }}" ./cmd/server
          cp README.md "$OUT/" 2>/dev/null || true

      - name: Package archive
        id: pkg
        shell: bash
        run: |
          cd dist
          NAME="${{ steps.vars.outputs.pkg }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${NAME}.zip" "$NAME"
            echo "asset=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${NAME}.tar.gz" "$NAME"
            echo "asset=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.pkg }}
          path: ${{ steps.pkg.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip 2>/dev/null > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
